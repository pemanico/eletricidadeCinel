<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto elétrico — rascunho</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--bd:#d0d7de;--mut:#656d76;--ac:#0969da;--bg2:#f6f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--bd:#30363d;--mut:#8b949e;--ac:#58a6ff;--bg2:#161b22}}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.warn{background:#fff5f5;color:#c62828;border-bottom:1px solid #c62828;padding:4px 12px;font-size:12px}
@media(prefers-color-scheme:dark){.warn{background:#3b1519;color:#ff9b9b}}
nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--bd)}
nav button{border:1px solid var(--bd);border-bottom:none;background:var(--bg2);color:var(--fg);padding:6px 12px;cursor:pointer;border-radius:6px 6px 0 0}
nav button.on{background:var(--bg);font-weight:600;color:var(--ac)}
main{padding:12px;max-width:1300px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:3px 6px;text-align:left;vertical-align:top}th{background:var(--bg2)}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px}
input[type=number]{width:90px}td input[type=text]{width:100%}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}button{cursor:pointer}
textarea{width:100%;min-height:380px;font-family:monospace;font-size:12px}
.svgbox{border:1px solid var(--bd);background:#fff;padding:4px}.svgbox svg{width:100%;height:auto;max-height:78vh}
.CUMPRE{color:#1a7f37}.NAO_CUMPRE{color:#c62828}.CONVENCAO{color:#9a6700}.POR_CONFIRMAR{color:#8250df}.AVISO{color:var(--ac)}
.e{font-weight:600}.mut{color:var(--mut)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:6px 0}
#msg{margin-left:auto;font-size:12px;color:var(--mut)}.err{color:#c62828!important}
</style>
<header>
 <b>⚡ Projeto elétrico</b>
 <select id="sel"></select><button id="novo">Novo</button><button id="exemplo">Exemplo T3</button>
 <span class="mut">Rev.</span><b id="rev">–</b><span id="sujo" class="mut"></span>
 <input id="motivo" placeholder="motivo da revisão" size="22"><button class="p" id="guardar">Guardar nova revisão</button>
 <span id="msg"></span>
</header>
<div class="warn">RASCUNHO NÃO ASSINADO — convenções editáveis e tabelas (ed. 2000) por confirmar. Assinatura e responsabilidade: técnico habilitado.</div>
<nav id="tabs"></nav><main id="main"></main>
<script src="/static/app.js"></script></html>
